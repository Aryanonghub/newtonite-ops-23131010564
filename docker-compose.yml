services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, on first start of an empty volume (creates the test DB).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://ops:ops@db:5432/ops
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # Migrate, seed (skipped if data exists), then start the API.
    command: sh -c "node dist/scripts/migrate.js && node dist/scripts/seed.js && node dist/index.js"

volumes:
  pgdata:
