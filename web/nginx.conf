server {
  listen 80;
  root /usr/share/nginx/html;

  # /api/items -> http://api:3000/items (the trailing slash strips the /api prefix)
  location /api/ {
    proxy_pass http://api:3000/;
  }

  # Single-page app: unknown paths like /items/42 load index.html and React Router takes over.
  location / {
    try_files $uri /index.html;
  }
}
